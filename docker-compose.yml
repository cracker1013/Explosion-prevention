services:
  # フロントエンド (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      - VITE_POSE_API_URL=http://pose-server:5000
      - VITE_REVIEW_API_URL=http://review-server:5001
    depends_on:
      - pose-server
      - review-server
    networks:
      - app-network

  # 姿勢推定サーバー (シミュレーションモード対応)
  pose-server:
    build:
      context: .
      dockerfile: Dockerfile.pose
    ports:
      - "${POSE_SERVER_PORT:-5000}:5000"
    environment:
      - SERIAL_PORT=${SERIAL_PORT:-COM3}
      - SERIAL_BAUD_RATE=${SERIAL_BAUD_RATE:-115200}
      - CAMERA_INDEX=${CAMERA_INDEX:-0}
      - SIMULATION_MODE=${SIMULATION_MODE:-true}
    # devices:
    #   - /dev/video0:/dev/video0  # Linux用カメラデバイス
    # privileged: true  # シリアルポートアクセス用
    networks:
      - app-network

  # OpenAIレビューサーバー
  review-server:
    build:
      context: .
      dockerfile: Dockerfile.review
    ports:
      - "${REVIEW_SERVER_PORT:-5001}:5001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - USE_FAKE_OPENAI=${USE_FAKE_OPENAI:-false}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
